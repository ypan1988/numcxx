name: Code Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov libopenblas-dev pkg-config
      
      - name: Clean and rebuild for coverage
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -DNUMCXX_ENABLE_COVERAGE=ON -DNUMCXX_ENABLE_TESTS=ON
          cmake --build . --clean-first -j $(nproc)
      
      - name: Run tests
        run: cd build && ctest --verbose
      
      - name: Generate coverage report
        run: |
          cd build
          lcov --directory . --capture --output-file coverage.info \
               --ignore-errors mismatch
          lcov --extract coverage.info '*/include/numcxx.h' \
               --output-file numcxx-coverage.info \
               --ignore-errors unused
          mv numcxx-coverage.info coverage.info
          if [ "$(grep -c '^SF:' coverage.info)" -ne 1 ] ||
             ! grep -q '^SF:.*/include/numcxx\.h$' coverage.info; then
            echo "Coverage report must contain only include/numcxx.h"
            grep '^SF:' coverage.info || true
            exit 1
          fi
          genhtml coverage.info --output-directory ../coverage_html
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.info
          flags: unittests
          name: numcxx-coverage
          fail_ci_if_error: false
          verbose: true
      
      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 30